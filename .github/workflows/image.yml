# Publishes ghcr.io/<owner>/wrench:edge and :sha-<7 hex> from master once the checks pass.
name: image

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    uses: ./.github/workflows/image-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      push: true
      version: edge
      tags: |
        type=edge,branch=master
        type=sha,prefix=sha-,format=short
