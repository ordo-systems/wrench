version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors belong to errcheck and its exclusions below
        - G304 # file paths come from the operator's configuration and directory listings, never from requests
        - G703 # same as G304, through taint analysis
    errcheck:
      # Closing a fully read HTTP response body has no actionable error.
      exclude-functions:
        - (io.ReadCloser).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - noctx
          - bodyclose
          - errcheck
          - gosec
      # Black-box test clients and the development mocks are not part of the served surface.
      - path: ^(tests/|internal/mock/|internal/app/mocks/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
